[package]
name = "hearthspace-session"
default-run = "hearthspace-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"

[dependencies]
caps = "0.5.6"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt", "time", "net", "io-util"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
hearthspace-common = { path = "../hearthspace-common" }
nix = { version = "0.31.3", features = ["signal", "process", "socket", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[dev-dependencies]
gio = "0.22.10"

[lints]
workspace = true
