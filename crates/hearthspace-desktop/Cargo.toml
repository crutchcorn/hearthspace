[package]
name = "hearthspace-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"

[dependencies]
dirs = "6.0.0"
freedesktop-icons = "0.4.0"
gio = { version = "0.22.10", features = ["v2_60"] }
gio-unix = "0.22.8"
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.47.0", default-features = false }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

nix = { version = "0.31.3", features = ["fs", "user"] }
tokio = { version = "1.53.3", features = ["macros", "rt", "time", "net"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

tempfile = "3.27.0"

[dev-dependencies]
rstest = "0.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
