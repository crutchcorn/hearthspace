[package]
name = "hearthspace-compositor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
default-run = "hearthspace-compositor"

[features]
default = ["winit", "xwayland"]
e2e = ["dep:waydriver", "dep:waydriver-hearthspace"]
test-apps = ["dep:gtk"]
udev = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    # Native mode still renders through one primary GPU, but Smithay's dmabuf
    # import path needs renderer_multi available for client buffers.
    "smithay/renderer_multi",
]
winit = ["smithay/backend_winit"]
xwayland = ["smithay/xwayland", "smithay/x11rb_event_source"]

[[bin]]
name = "hearthspace"
path = "src/bin/hearthspace.rs"

[[bin]]
name = "hearthspace-clipboard-test"
path = "src/bin/hearthspace-clipboard-test.rs"
required-features = ["test-apps"]

[[bin]]
name = "hearthspace-window-test"
path = "src/bin/hearthspace-window-test.rs"
required-features = ["test-apps"]

[dependencies]
async-io = "2.6.0"
atspi = { version = "0.30.0", features = ["zbus"] }
calloop = { version = "0.14.5", features = ["signals"] }
cursor-icon = "1.2.0"
gtk = { package = "gtk4", version = "0.11.5", optional = true }
hearthspace-ai = { path = "../hearthspace-ai" }
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
hearthspace-shell = { path = "../hearthspace-shell" }
hearthspace-ui-components = { path = "../ui-components" }
# Xilem (app shell) and Masonry (compositor-side imaging) are pulled from
# upstream git because the latest published crates are still behind the APIs we
# use, including `WindowOptionsExtLinux::with_name`.
masonry = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", features = ["testing"] }
xilem = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
# naga 28 (pulled in transitively via wgpu/vello) only compiles its WGSL
# error-emit path when the `termcolor` feature is enabled, but the crates that
# depend on it (wgpu-core, vello_shaders) enable `wgsl-in` without it. We add a
# direct dependency purely to union `termcolor` into the shared naga build.
naga = { version = "28.0.0", default-features = false, features = ["termcolor"] }
# Parley's fontique discovers system fonts via fontconfig. Enabling its
# `fontconfig-dlopen` code path makes it load libfontconfig at runtime instead
# of link-time, which avoids needing fontconfig dev headers at build time.
fontique = { version = "0.8.0", features = ["fontconfig-dlopen"] }
# Masonry's CPU render harness returns an `image::RgbaImage`; name the type
# directly so the title-text raster path is testable. Pulled in transitively
# already, so this only fixes the version we link against.
image = { version = "0.25.10", default-features = false }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay = { git = "https://github.com/Smithay/smithay", rev = "5c2ba4132556a08abc70ae1771d275ec2cfc031f", default-features = false, features = ["desktop", "renderer_gl", "wayland_frontend"] }
tiny-skia = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-protocols = { version = "0.32.13", features = ["server"] }
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"
waydriver = { version = "0.3.10", optional = true }
waydriver-hearthspace = { path = "../waydriver-hearthspace", optional = true }
xcursor = "0.3.11"

[dev-dependencies]
# Exercise the shell runtime's real window lifecycle against the headless server.
masonry_winit = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
proptest = "1.12.0"
rstest = "0.27.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-util = "0.7.20"

[[test]]
name = "headless_control"
path = "tests/headless_control.rs"
required-features = ["e2e"]

[[test]]
name = "waydriver_hearthspace"
path = "tests/waydriver_hearthspace.rs"
required-features = ["e2e"]

# Workaround for an upstream incompatibility pulled in via Xilem/Masonry:
# `vello_shaders` 0.8's build script depends on `naga` 28 with the `wgsl-in`
# feature but without `termcolor`, yet naga 28's WGSL error-emit path only
# compiles when `termcolor` is enabled. Declaring naga in our own build graph
# with `termcolor` makes Cargo unify that feature in, so the vello shader build
# script compiles. The empty `build.rs` exists solely to activate this entry.
[build-dependencies]
naga = { version = "28.0.0", default-features = false, features = ["wgsl-in", "termcolor"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
