[package]
name = "hearthspace-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"

[dependencies]
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
hearthspace-ui-components = { path = "../ui-components" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
xilem = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
