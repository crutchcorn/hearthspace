[package]
name = "hearthspace-settingsd"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"

[dependencies]
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
nix = { version = "0.31.3", features = ["poll"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
