[package]
name = "hearthspace-settingsd"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"

[dependencies]
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
