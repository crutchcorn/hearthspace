[package]
name = "hearthspace-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"

[dependencies]
hearthspace-ai = { path = "../hearthspace-ai" }
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
hearthspace-shell = { path = "../hearthspace-shell" }
hearthspace-ui-components = { path = "../ui-components" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.17.2", features = ["xdg-portal"] }
wayland-client = "0.31.15"
xilem = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }

[dev-dependencies]
masonry = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", features = ["testing"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
