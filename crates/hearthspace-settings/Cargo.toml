[package]
name = "hearthspace-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "Apache-2.0"

[dependencies]
hearthspace-common = { path = "../hearthspace-common" }
hearthspace-ipc = { path = "../hearthspace-ipc" }
hearthspace-ui-components = { path = "../ui-components" }
rfd = { version = "0.17.2", features = ["xdg-portal"] }
wayland-client = "0.31.14"
xilem = { git = "https://github.com/crutchcorn/xilem", branch = "wayland-app-id" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
