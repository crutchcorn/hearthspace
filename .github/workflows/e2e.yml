name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Headless E2E
    # WayVNC >= 0.9 provides ext-image-copy-capture; 24.04 ships 0.7.
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adwaita-icon-theme \
            at-spi2-core \
            build-essential \
            clang \
            dbus \
            foot \
            gir1.2-gtk-3.0 \
            gir1.2-gtk-4.0 \
            libayatana-appindicator3-1 \
            libclang-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dri \
            libgles2-mesa-dev \
            libglib2.0-bin \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-4-dev \
            libgtk-3-0t64 \
            libgtk4-layer-shell-dev \
            libgtk4-session-lock-dev \
            libinput-dev \
            libpam0g-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config \
            python3 \
            python3-gi \
            wayland-protocols \
            wayland-utils \
            wayvnc \
            xdg-desktop-portal \
            curl \
            patch \
            x11-xkb-utils \
            meson \
            ninja-build \
            libxfont-dev \
            libfontenc-dev \
            libxcvt-dev \
            libxkbfile-dev \
            libxshmfence-dev \
            libmd-dev \
            mesa-common-dev \
            libtirpc-dev \
            libxcb-cursor-dev \
            libxcb-composite0-dev \
            libxcb-res0-dev

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build workspace binaries and test targets
        run: cargo build --locked --workspace --all-targets --features udev,e2e,test-apps

      - name: Prepare private Xwayland
        uses: ./.github/actions/prepare-xwayland

      - name: Run the required E2E profile
        run: scripts/test-e2e --no-build --evidence "$RUNNER_TEMP/hearthspace-e2e"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless-e2e-evidence
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/hearthspace-e2e/
            ${{ runner.temp }}/hearthspace-xwayland-result.json
            ${{ runner.temp }}/hearthspace-xwayland-build/*.log
            ${{ runner.temp }}/hearthspace-xwayland-build/build-receipt.json
            ${{ runner.temp }}/hearthspace-xwayland-build/build/meson-logs/*.txt
