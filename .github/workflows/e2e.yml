name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Headless E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      HEARTHSPACE_E2E: "1"
      HEARTHSPACE_REQUIRE_ATSPI: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            build-essential \
            clang \
            dbus \
            foot \
            libclang-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dri \
            libgles2-mesa-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-4-dev \
            libinput-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config \
            python3 \
            wayland-protocols \
            wayland-utils \
            xwayland

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build workspace binaries and test targets
        run: cargo build --locked --workspace --all-targets --features udev,e2e,test-apps

      # Keep GPU workloads sequential, including within each Rust test binary.
      - name: Run Rust workspace and headless E2E tests
        run: cargo test --locked --workspace --all-targets --features udev,e2e,test-apps -- --test-threads=1

      - name: Run Python agent and cross-app clipboard regressions
        run: python3 -m unittest discover -s scripts/tests -v
