name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, format, and lint
    # Native gtk4-session-lock >= 1.3 is packaged on 26.04, not 24.04.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang libclang-dev \
            libwayland-dev wayland-protocols libinput-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libudev-dev \
            libseat-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libsystemd-dev libgtk-4-dev \
            libgtk4-session-lock-dev libgtk4-layer-shell-dev libpam0g-dev \
            libglib2.0-bin python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev python3 python3-venv dbus \
            xdg-desktop-portal

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Python formatting and lint
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install ruff==0.17.0
          "$RUNNER_TEMP/ruff/bin/ruff" check scripts
          "$RUNNER_TEMP/ruff/bin/ruff" format --check scripts

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features udev,e2e,test-apps -- -D warnings

      - name: Build all workspace targets
        run: cargo build --locked --workspace --all-targets --features udev,e2e,test-apps

      # Rendering/accessibility integration tests run in the E2E workflow.
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets --features udev,test-apps

      - name: Test agent helpers
        run: python3 -m unittest discover -s scripts/tests -v

  deny:
    name: Dependency advisories and bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No deny.toml is committed yet, so cargo-deny runs with its built-in
      # defaults. The license check is intentionally omitted because it needs an
      # explicit allow-list to be meaningful; advisories/bans/sources are useful
      # out of the box. `unmaintained` is downgraded to a warning because its
      # only hits are transitive dependencies with no safe upgrade available;
      # genuine vulnerabilities/unsound advisories still fail the job.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: 1.99.0
          command: check advisories bans sources
          command-arguments: "--warn unmaintained"
