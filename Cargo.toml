[workspace]
resolver = "2"
members = [
    "crates/hearthspace-ai",
    "crates/hearthspace-compositor",
    "crates/hearthspace-common",
    "crates/hearthspace-desktop",
    "crates/hearthspace-ipc",
    "crates/hearthspace-notifications",
    "crates/hearthspace-session",
    "crates/hearthspace-settings",
    "crates/hearthspace-settingsd",
    "crates/hearthspace-shell",
    "crates/hearthspace-ui-storybook",
    "crates/hearthspace-wayland-client",
    "crates/ui-components",
    "crates/waydriver-hearthspace",
    "crates/xilem-storybook",
]
default-members = ["crates/hearthspace-session"]
exclude = [
    "vendor/accesskit_atspi_common",
    "vendor/xilem",
    "vendor/masonry_winit",
    "vendor/masonry",
    "vendor/smithay",
    "vendor/winit",
]

[patch.crates-io]
# Backport the upstream fix for out-of-order AT-SPI window activation.
# Provenance and removal conditions: patches/README.md.
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
# Backport queued Wayland update cleanup when transient windows are destroyed.
# Provenance and removal conditions: patches/README.md.
winit = { path = "vendor/winit" }

[patch."https://github.com/linebender/xilem"]
# Preserve per-window themes during creation, not only later rebuilds.
# Provenance and removal conditions: patches/README.md.
xilem = { path = "vendor/xilem" }
masonry_winit = { path = "vendor/masonry_winit" }
# Keep scrollbar geometry finite across focus reveal and viewport resize.
# Provenance and removal conditions: patches/README.md.
masonry = { path = "vendor/masonry" }

[patch."https://github.com/Smithay/smithay"]
# Publish XSettings and correctly dispatch X11 and touch cancellation.
# Provenance and removal conditions: patches/README.md.
smithay = { path = "vendor/smithay" }

# Centralized lint policy so local `cargo clippy`/`cargo build` enforce the same
# discipline as CI (which also passes `-D warnings` to escalate rustc warnings).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
