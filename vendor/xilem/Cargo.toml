# Pinned upstream manifest with workspace inheritance resolved. See PROVENANCE.md.
[package]
name = "xilem"
version = "0.4.0"
description = "A next-generation cross-platform Rust UI framework."
keywords = ["gui", "ui", "native", "gpu", "performance"]
categories = ["gui", "graphics", "internationalization", "accessibility"]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/linebender/xilem"
autoexamples = false
autotests = false
autobenches = false

[features]
default = ["masonry/default", "masonry_winit/default", "imaging_vello"]
imaging_vello = ["masonry/imaging_vello", "masonry_winit/imaging_vello", "xilem_masonry/imaging_vello"]
imaging_vello_hybrid = ["masonry/imaging_vello_hybrid", "masonry_winit/imaging_vello_hybrid", "xilem_masonry/imaging_vello_hybrid"]
imaging_skia = ["masonry/imaging_skia", "masonry_winit/imaging_skia", "xilem_masonry/imaging_skia"]

[dependencies]
xilem_core = { version = "0.4.0", git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
xilem_masonry = { version = "0.4.0", git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
masonry = { version = "0.4.0", default-features = false, git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
masonry_winit = { version = "0.4.0", default-features = false, git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
winit = { version = "0.30.13" }
tracing = { version = "0.1.44", default-features = false }
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "time", "sync"] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(compile_stress_test)"] }
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
