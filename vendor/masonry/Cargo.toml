# Pinned upstream manifest with workspace inheritance resolved. See PROVENANCE.md.
[package]
name = "masonry"
version = "0.4.0"
description = "Traits and types of the Masonry toolkit."
keywords = ["gui", "ui", "toolkit"]
categories = ["gui", "internationalization", "accessibility"]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/linebender/xilem"
exclude = ["screenshots", "examples/assets"]
autoexamples = false
autotests = false
autobenches = false

[features]
default = ["masonry_core/default", "imaging_vello"]
imaging_vello = ["masonry_winit/imaging_vello"]
imaging_vello_hybrid = ["masonry_winit/imaging_vello_hybrid"]
imaging_skia = ["masonry_winit/imaging_skia"]
tracy = ["masonry_core/tracy"]
testing = ["dep:masonry_testing"]

[dependencies]
accesskit = { version = "0.24.0" }
masonry_core = { version = "0.4.0", default-features = false, git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
masonry_testing = { version = "0.4.0", default-features = false, git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", optional = true }
smallvec = { version = "1.15.1" }
tracing = { version = "0.1.44", default-features = false, features = ["default"] }
include_doc_path = { version = "0.1.0", package = "linebender_include_doc_path", git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
resvg = { version = "0.47.0" }
understory_virtual_list = "0.1.2"

[dev-dependencies]
accesskit_consumer = { version = "0.35.0" }
divan = { version = "0.1.21" }
float-cmp = { version = "0.10.0", features = ["std"], default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
insta = { version = "1.46.3" }
masonry_testing = { version = "0.4.0", default-features = false, git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
masonry_winit = { version = "0.4.0", default-features = false, git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
profiling = { version = "1.0.17", features = ["profile-with-tracing"] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(compile_stress_test)"] }
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
