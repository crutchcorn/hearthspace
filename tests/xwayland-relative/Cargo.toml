[package]
name = "relative-confinement-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Independent artifact: never joins or builds the Hearthspace workspace.
[workspace]

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
smithay = { path = "../../vendor/smithay", default-features = false, features = ["wayland_frontend"] }
wayland-server = "=0.31.14"
x11rb = { version = "=0.13.2", features = ["composite", "xfixes", "xinput"] }
